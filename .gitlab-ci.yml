image: tk120404/node:22.2.0      

variables:
  GIT_STRATEGY: fetch

dev_build:
  tags:
    - sarovar-dev
  stage: build
  environment:
    name: dev
  script:
    - npm install
    - npm run build
    - echo $devEnvKey | base64 -d > devEnvKey.pem
    - chmod 400 devEnvKey.pem
    - zip -qq -r $CI_JOB_ID.zip ./ -x devEnvKey.pem
    - scp -i devEnvKey.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $CI_JOB_ID.zip ubuntu@dev-api.instavans.com:/home/ubuntu/milkyway/packages/juggernaut-$CI_JOB_ID.zip
    - ssh -t -t -i devEnvKey.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ubuntu@dev-api.instavans.com << EOF
    - rm -rf /home/ubuntu/milkyway/juggernaut/*
    - cd /home/ubuntu/milkyway/juggernaut
    - cp /home/ubuntu/milkyway/packages/juggernaut-$CI_JOB_ID.zip .
    - unzip -qq -o juggernaut-$CI_JOB_ID.zip
    - rm -rf juggernaut-$CI_JOB_ID.zip
    - ls
    - rm /home/ubuntu/milkyway/packages/juggernaut-$CI_JOB_ID.zip
    # - rm -rf node_modules
    - nvm use v22
    - npm ci
    - nvm use default
    - pm2 reload juggernaut
    - exit
